name: Verify RuleGo Plugin ABI images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: plugin-abi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    name: Run offline repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the offline test suite
        run: tests/run.sh

  contract:
    name: Validate Plugin ABI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Render native matrix
        id: contract
        run: echo "matrix=$(scripts/plugin-abi.sh render matrix)" >>"$GITHUB_OUTPUT"

  native:
    name: Native ${{ matrix.goarch }} SDK/runtime verification
    needs: contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract.outputs.matrix) }}
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true
      - name: Build and verify native artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/plugin-abi-build.sh "${{ matrix.goarch }}"
      - name: Upload native evidence
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-abi-${{ matrix.goarch }}
          path: tmp/plugin-abi-${{ matrix.goarch }}.json
          if-no-files-found: error
