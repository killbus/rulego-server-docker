name: Publish RuleGo Server images

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Published stable RuleGo version (vX.Y.Z)"
        required: true
        type: string
      force:
        description: "Rebuild tags even when complete manifests already exist"
        required: false
        default: false
        type: boolean
      staging_only:
        description: "Publish only the immutable staging tag and keep every release tag untouched"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-rulego-server-images
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release and publication state
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image: ${{ steps.release.outputs.image }}
      is_latest: ${{ steps.release.outputs.is_latest }}
      should_build: ${{ steps.release.outputs.should_build }}
      version: ${{ steps.release.outputs.version }}
      staging_only: ${{ steps.release.outputs.staging_only }}
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stable release and existing tags
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REQUESTED_FORCE: ${{ github.event.inputs.force }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REQUESTED_STAGING_ONLY: ${{ github.event.inputs.staging_only }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # shellcheck source=scripts/lib.sh
          source scripts/lib.sh

          if [[ $EVENT_NAME == schedule ]]; then
            resolution=$(scripts/resolve-release.sh)
          else
            resolution=$(scripts/resolve-release.sh "$REQUESTED_VERSION")
          fi
          version=$(jq -er '.version' <<<"$resolution")
          latest_version=$(jq -er '.latest_version' <<<"$resolution")
          is_latest=$(jq -er '.is_latest' <<<"$resolution")
          owner=${REPOSITORY_OWNER,,}
          image="ghcr.io/${owner}/rulego-server"
          force=false
          if [[ $EVENT_NAME == workflow_dispatch && $REQUESTED_FORCE == true ]]; then force=true; fi
          staging_only=false
          if [[ $EVENT_NAME == workflow_dispatch && $REQUESTED_STAGING_ONLY == true ]]; then staging_only=true; fi

          should_build=true
          # A staging run always builds: the release tags already being complete is
          # exactly the state that makes the short circuit skip the path under test.
          if [[ $force == false && $staging_only == false ]]; then
            all_complete=true
            for suffix in '' '-all'; do
              version_ref="${image}:${version}${suffix}"
              if version_digest=$(image_manifest_digest "$version_ref"); then
                if [[ $is_latest == true ]]; then
                  if [[ $suffix == '-all' ]]; then moving_ref="${image}:latest-all"; else moving_ref="${image}:latest"; fi
                  if moving_digest=$(image_manifest_digest "$moving_ref"); then
                    if [[ $moving_digest != "$version_digest" ]]; then all_complete=false; fi
                  else
                    status=$?
                    if (( status == 2 )); then exit 1; fi
                    all_complete=false
                  fi
                fi
              else
                status=$?
                if (( status == 2 )); then exit 1; fi
                all_complete=false
              fi
            done
            if [[ $all_complete == true ]]; then should_build=false; fi
          fi

          {
            echo "image=${image}"
            echo "is_latest=${is_latest}"
            echo "should_build=${should_build}"
            echo "version=${version}"
            echo "staging_only=${staging_only}"
          } >>"$GITHUB_OUTPUT"

          echo "Selected ${version}; current stable=${latest_version}; build=${should_build}; force=${force}; staging_only=${staging_only}"

  build:
    name: Build ${{ matrix.variant }} image on ${{ matrix.architecture }}
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tag_suffix: ""
            moving_tag: latest
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - variant: standard
            tag_suffix: ""
            moving_tag: latest
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: all
            tag_suffix: -all
            moving_tag: latest-all
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - variant: all
            tag_suffix: -all
            moving_tag: latest-all
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify upstream release payloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: scripts/fetch-release.sh "$RELEASE_VERSION" "$VARIANT"

      - name: Verify local image filesystems and smoke tests
        run: scripts/verify-build.sh "${{ matrix.architecture }}"

      - name: Generate image metadata
        id: metadata
        # docker/metadata-action v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ needs.resolve.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=RuleGo Server (${{ matrix.variant }})
            org.opencontainers.image.description=RuleGo Server official release binary packaged as a non-root container
            io.rulego.image.variant=${{ matrix.variant }}
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            io.rulego.image.variant=${{ matrix.variant }}

      - name: Build and push native image by digest
        id: build
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          outputs: type=image,name=${{ needs.resolve.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=rulego-server-${{ matrix.variant }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=rulego-server-${{ matrix.variant }}-${{ matrix.architecture }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${ARCHITECTURE}.${DIGEST#sha256:}"

      - name: Upload image digest
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-digest-${{ matrix.variant }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.variant }} image index
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tag_suffix: ""
            moving_tag: latest
          - variant: all
            tag_suffix: -all
            moving_tag: latest-all
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        # actions/download-artifact v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-digest-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Generate image metadata
        id: metadata
        # docker/metadata-action v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ needs.resolve.outputs.image }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}${{ matrix.tag_suffix }},enable=${{ needs.resolve.outputs.staging_only == 'false' }}
            type=raw,value=staging-${{ needs.resolve.outputs.version }}${{ matrix.tag_suffix }}-${{ github.run_id }},enable=${{ needs.resolve.outputs.staging_only == 'true' }}
            type=raw,value=${{ matrix.moving_tag }},enable=${{ needs.resolve.outputs.is_latest == 'true' && needs.resolve.outputs.staging_only == 'false' }}
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            io.rulego.image.variant=${{ matrix.variant }}

      - name: Create multi-platform image index
        id: index
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          ANNOTATIONS: ${{ steps.metadata.outputs.annotations }}
          # Declared rather than inferred: publish-index.sh writes only the immutable tag and hands
          # the alias back as data, for the verifier to authorise. Empty exactly when the metadata
          # action does not produce one — a staging run, or a version that is not the latest.
          MOVING_ALIASES: ${{ needs.resolve.outputs.is_latest == 'true' && needs.resolve.outputs.staging_only == 'false' && matrix.moving_tag || '' }}
        run: scripts/publish-index.sh "${RUNNER_TEMP}/digests" "${IMAGE}"

      - name: Download and verify upstream release payloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: scripts/fetch-release.sh "$RELEASE_VERSION" "$VARIANT"

      - name: Verify published version manifest and executables
        id: verify
        env:
          PUBLISHED_TAG: ${{ steps.index.outputs.canonical_tag }}
        run: scripts/verify-published.sh "${PUBLISHED_TAG}"

      # Runs only after the immutable tag has been verified, and refuses to move the alias unless the
      # canonical name still resolves to exactly the digest that was just verified. This is the gap
      # the single-write assembly did not have: `latest` used to point at unverified content for as
      # long as verification took, and a verification failure left it there.
      # The alias itself is not re-verified: promote-alias.sh refuses to move it unless the alias
      # resolves to the same digest the step above already verified, and two names holding one digest
      # carry one content. Re-pulling both platforms to check the same bytes again would buy a second
      # sample of the registry, not a second look at the artifact.
      - name: Promote the moving alias to the verified digest
        if: needs.resolve.outputs.is_latest == 'true' && needs.resolve.outputs.staging_only == 'false'
        env:
          CANONICAL_TAG: ${{ steps.index.outputs.canonical_tag }}
          # Taken from the step that verified the image, not from the step that wrote it: the alias
          # may only be pointed at bytes the verifier actually looked at.
          CANONICAL_DIGEST: ${{ steps.verify.outputs.verified_digest }}
          # Space-separated list produced by publish-index.sh. Registry references contain no spaces,
          # so it is split on words to give one argument per alias; quoted, a two-alias run would
          # hand both names over as a single name that belongs to no repository.
          ALIAS_LIST: ${{ steps.index.outputs.moving_aliases }}
          PROMOTE_ALIAS_RECORD: ${{ runner.temp }}/alias-promotion-${{ matrix.variant }}.json
        run: |
          # shellcheck disable=SC2086
          scripts/promote-alias.sh "${CANONICAL_TAG}" "${CANONICAL_DIGEST}" ${ALIAS_LIST}
      - name: Upload the alias promotion record
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alias-promotion-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/alias-promotion-${{ matrix.variant }}.json
          # Unlike the sibling uploads this must not be `error`: a run that went red before the
          # promotion ever started genuinely has no record, and turning that absence into a second
          # failure buries the first one. The record is what matters precisely when the promotion
          # failed partway, and in that case the file exists.
          if-no-files-found: ignore
