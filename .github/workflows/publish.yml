name: Publish RuleGo Server images

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Published stable RuleGo version (vX.Y.Z)"
        required: true
        type: string
      force:
        description: "Rebuild tags even when complete manifests already exist"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-rulego-server-images
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release and publication state
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image: ${{ steps.release.outputs.image }}
      is_latest: ${{ steps.release.outputs.is_latest }}
      should_build: ${{ steps.release.outputs.should_build }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stable release and existing tags
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REQUESTED_FORCE: ${{ github.event.inputs.force }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # shellcheck source=scripts/lib.sh
          source scripts/lib.sh

          if [[ $EVENT_NAME == schedule ]]; then
            resolution=$(scripts/resolve-release.sh)
          else
            resolution=$(scripts/resolve-release.sh "$REQUESTED_VERSION")
          fi
          version=$(jq -er '.version' <<<"$resolution")
          latest_version=$(jq -er '.latest_version' <<<"$resolution")
          is_latest=$(jq -er '.is_latest' <<<"$resolution")
          owner=${REPOSITORY_OWNER,,}
          image="ghcr.io/${owner}/rulego-server"
          force=false
          if [[ $EVENT_NAME == workflow_dispatch && $REQUESTED_FORCE == true ]]; then force=true; fi

          should_build=true
          if [[ $force == false ]]; then
            all_complete=true
            for suffix in '' '-all'; do
              version_ref="${image}:${version}${suffix}"
              if version_digest=$(image_manifest_digest "$version_ref"); then
                if [[ $is_latest == true ]]; then
                  if [[ $suffix == '-all' ]]; then moving_ref="${image}:latest-all"; else moving_ref="${image}:latest"; fi
                  if moving_digest=$(image_manifest_digest "$moving_ref"); then
                    if [[ $moving_digest != "$version_digest" ]]; then all_complete=false; fi
                  else
                    status=$?
                    if (( status == 2 )); then exit 1; fi
                    all_complete=false
                  fi
                fi
              else
                status=$?
                if (( status == 2 )); then exit 1; fi
                all_complete=false
              fi
            done
            if [[ $all_complete == true ]]; then should_build=false; fi
          fi

          {
            echo "image=${image}"
            echo "is_latest=${is_latest}"
            echo "should_build=${should_build}"
            echo "version=${version}"
          } >>"$GITHUB_OUTPUT"

          echo "Selected ${version}; current stable=${latest_version}; build=${should_build}; force=${force}"

  publish:
    name: Publish ${{ matrix.variant }} image
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tag_suffix: ""
            moving_tag: latest
          - variant: all
            tag_suffix: -all
            moving_tag: latest-all
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up QEMU
        # docker/setup-qemu-action v4.2.0
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify upstream release payloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: scripts/fetch-release.sh "$RELEASE_VERSION" "$VARIANT"

      - name: Verify local image filesystems and smoke tests
        run: scripts/verify-build.sh

      - name: Generate image metadata
        id: metadata
        # docker/metadata-action v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ needs.resolve.outputs.image }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.moving_tag }},enable=${{ needs.resolve.outputs.is_latest == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=RuleGo Server (${{ matrix.variant }})
            org.opencontainers.image.description=RuleGo Server official release binary packaged as a non-root container
            io.rulego.image.variant=${{ matrix.variant }}
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            io.rulego.image.variant=${{ matrix.variant }}

      - name: Build and push multi-platform image
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=rulego-server-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=rulego-server-${{ matrix.variant }}
          provenance: mode=max
          sbom: true

      - name: Verify published version manifest and executables
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
        run: scripts/verify-published.sh "${IMAGE}:${RELEASE_VERSION}${TAG_SUFFIX}"

      - name: Verify published moving alias
        if: needs.resolve.outputs.is_latest == 'true'
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          MOVING_TAG: ${{ matrix.moving_tag }}
        run: scripts/verify-published.sh "${IMAGE}:${MOVING_TAG}"
